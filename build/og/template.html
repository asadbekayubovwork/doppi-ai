<!doctype html>
<!--
  Link-preview image (1200x630) for Telegram, Facebook, WhatsApp and X.
  render.mjs opens this file in headless Chrome with the copy in the query
  string (eyebrow, title, highlight, sub) and saves a screenshot per page.
-->
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        font-weight: 500;
        src: url(../../src/app/fonts/inter-v20-latin-500.woff2) format("woff2");
      }
      @font-face {
        font-family: Inter;
        font-weight: 600;
        src: url(../../src/app/fonts/inter-v20-latin-600.woff2) format("woff2");
      }
      @font-face {
        font-family: Inter;
        font-weight: 800;
        src: url(../../src/app/fonts/inter-v20-latin-800.woff2) format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0e041f;
        font-family: Inter, system-ui, sans-serif;
      }

      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 60px 72px 56px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(900px 520px at 88% -12%, rgba(102, 51, 238, 0.6), transparent 62%),
          radial-gradient(640px 420px at -8% 112%, rgba(102, 51, 238, 0.28), transparent 60%),
          #0e041f;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
        mask-image: linear-gradient(to bottom, black 20%, transparent 90%);
      }

      .content {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
      }

      .logo {
        height: 54px;
        width: auto;
        align-self: flex-start;
      }

      .eyebrow {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #b9a2ff;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 44px;
        height: 2px;
        background: #6633ee;
      }

      h1 {
        margin: 20px 0 0;
        max-width: 1040px;
        color: #fff;
        font-size: 64px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .highlight {
        background: linear-gradient(90deg, #b9a2ff, #8f6bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .footer {
        margin-top: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .sub {
        min-width: 0;
        overflow: hidden;
        color: #a3a3a3;
        font-size: 26px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .url {
        flex-shrink: 0;
        padding: 12px 22px;
        border: 1px solid rgba(185, 162, 255, 0.35);
        border-radius: 14px;
        background: rgba(102, 51, 238, 0.22);
        color: #fff;
        font-size: 24px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="content">
        <img class="logo" src="../../src/shared/assets/brand/logo.svg" alt="" />
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <div class="footer">
          <div class="sub" id="sub"></div>
          <div class="url">doppiai.uz</div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search)
      document.getElementById("eyebrow").textContent = params.get("eyebrow") ?? ""
      document.getElementById("sub").textContent = params.get("sub") ?? ""

      const title = document.getElementById("title")
      title.append(params.get("title") ?? "")
      if (params.get("highlight")) {
        const span = document.createElement("span")
        span.className = "highlight"
        span.textContent = params.get("highlight")
        title.append(" ", span)
      }

      // Long service titles would push the footer off the card; shrink the
      // heading until it fits in three lines.
      const maxHeight = 3 * 1.1 * 64
      let size = 64
      while (title.scrollHeight > maxHeight * (size / 64) + 2 && size > 44) {
        size -= 2
        title.style.fontSize = `${size}px`
      }
    </script>
  </body>
</html>
