name: Production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push waits for the running deploy rather than cutting it off; runs
# queued behind it are superseded by the newest one.
concurrency:
  group: doppi-frontend-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 34.27.103.62
  DEPLOY_PORT: 8800
  DEPLOY_USER: doppiai
  SITE_URL: https://doppiai.uz

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          set -euo pipefail
          pnpm test
          pnpm lint
          pnpm exec vue-tsc --noEmit
          pnpm audit --prod --audit-level high
          git diff --check
          # Generated Lucide geometry is data, not hand-maintained source.
          find src -type f \( -name '*.ts' -o -name '*.vue' -o -name '*.css' \) \
            ! -path 'src/shared/ui/icons/icon-part-*.ts' -print0 \
            | xargs -0 -n1 wc -l \
            | awk '$1 >= 400 {print; found=1} END {exit found}'

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_GOOGLE_OAUTH_URL: /api/v1/auth/oauth/google/authorize
          VITE_EMAIL_AUTH_ENABLED: "false"
          VITE_TELEGRAM_AUTH_ENABLED: "false"
        run: pnpm build

      # The key is pinned server-side to /usr/local/bin/doppiai-release, so the
      # words after the host are that script's arguments, not a shell command.
      - name: Deploy atomically
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Repository secret DEPLOY_SSH_KEY is not set (see Deployment in README.md)."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pinned rather than learned on first use, so a spoofed host cannot
          # receive the build. Update these if the server is ever rebuilt.
          # A non-default port is part of the host name ssh looks up.
          cat > ~/.ssh/known_hosts <<'EOF'
          [34.27.103.62]:8800 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINq47X8DaBgpE9HsgWT/6PkklLOkHWwyAMSxtmFecTVJ
          [34.27.103.62]:8800 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMwzlzghrR/NGrUhkUKpqxy16yxleNHkM4z6fZBN/G12uk5fnNvjhTwF5Dk6PgGAfF7ONaOzK9N1UQqel6gCrkI=
          [34.27.103.62]:8800 ssh-rsa 
          EOF

          release="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf - -C dist . | ssh \
            -p "$DEPLOY_PORT" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" activate "$release"

      - name: Verify public deployment
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          expected=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html)
          live=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$SITE_URL/")
          if ! grep -qF "$expected" <<<"$live"; then
            echo "::error::$SITE_URL is not serving $expected from this build."
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 2 -o /dev/null "$SITE_URL/$expected"
          # Deep links only work through the nginx SPA fallback.
          curl --fail --silent --show-error --retry 5 --retry-delay 2 -o /dev/null "$SITE_URL/login"
          echo "Live: $SITE_URL ($expected)"
