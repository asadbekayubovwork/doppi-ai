# Do'ppi AI frontend — static Vue SPA served from an atomically swapped release
# directory. Deploys replace the `current` symlink, so nginx never reads a
# half-written tree.

# HTML revalidates on every visit so a deploy shows up at once; other files
# served from `location /` (team photos, icons) keep default caching.
map $sent_http_content_type $doppiai_html_cache {
    ~^text/html  "no-cache";
    default      "";
}

# Plain HTTP exists only to answer ACME challenges and send everything else to
# the canonical HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name doppiai.uz www.doppiai.uz;

    # Must stay ahead of the redirect, and the redirect must live in a location
    # block: a server-level `return` runs in the rewrite phase and would
    # short-circuit ACME renewals before nginx reaches any location.
    include /etc/nginx/snippets/doppiai-acme.conf;

    location / {
        return 301 https://doppiai.uz$request_uri;
    }
}

# Canonical host is the apex; www exists only to redirect onto it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.doppiai.uz;

    ssl_certificate     /etc/letsencrypt/live/doppiai.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doppiai.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://doppiai.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doppiai.uz;

    ssl_certificate     /etc/letsencrypt/live/doppiai.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doppiai.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/doppiai.uz/current;
    index index.html;

    access_log /var/log/nginx/doppiai.uz.access.log;
    error_log  /var/log/nginx/doppiai.uz.error.log;

    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json;

    # The SPA reads its API off the same origin so the HttpOnly `__Host-`
    # session cookie stays on the public origin; the backend listens on
    # 127.0.0.1:18000.
    # Do'ppi native API begin
    # Include inside the existing doppiai.uz HTTPS server block.

    location = /api/v1/auth/oauth/google/callback {
        client_max_body_size 1m;
        access_log off;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:18000/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:18000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /metrics {
        deny all;
        return 404;
    }
    # Do'ppi native API end

    # Vite writes content-hashed filenames into /assets, so a new build always
    # means a new URL and these can be cached indefinitely.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Named files keep their own URLs across builds, so they must revalidate.
    location ~* ^/(robots\.txt|sitemap\.xml|favicon\.(ico|svg))$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # "/" is served as index.html directly: try_files would otherwise treat the
    # root as a directory and fall through to the noindex shell.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Pages in SEO_PAGES are prebuilt as /<path>.html (build/seo.ts), each with
    # its own title, description and canonical link. Any other path gets the
    # noindex app shell and is left to Vue Router.
    location / {
        add_header Cache-Control $doppiai_html_cache always;
        try_files $uri $uri.html @spa;
    }

    # index.html covers a release built before app.html existed.
    location @spa {
        add_header Cache-Control "no-cache" always;
        try_files /app.html /index.html =404;
    }
}
